[project]
name = "fissionplane"
version = "0.0.1b0"
description = "Python SDK for the fissionplane control plane and sandbox data plane."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Manuel Suarez", email = "manuel_angel99@outlook.com" }]
requires-python = ">=3.10"
# Runtime dependencies for the generated HTTP clients and handwritten streams.
dependencies = [
  "httpx>=0.28,<1",
  "attrs>=22.2",
  "python-dateutil>=2.8",
  "typing-extensions>=4.6",
  "websockets>=16,<17",
]

[project.urls]
Homepage = "https://github.com/ManuelAngel99/fissionplane"
Repository = "https://github.com/ManuelAngel99/fissionplane"

[dependency-groups]
dev = ["pdoc>=15", "pytest>=8", "ruff>=0.14", "ty>=0.0.1a21"]

[tool.ruff]
# The generated cores are formatted by the generator's own pinned ruff;
# linting or reformatting them here would fight the drift check.
extend-exclude = ["fissionplane/_api", "fissionplane/_dataplane"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # import sorting
  "UP", # pyupgrade
  "B", # bugbear
  "SIM", # simplify
]

[tool.ty.src]
exclude = ["fissionplane/_api", "fissionplane/_dataplane", ".venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fissionplane"]
