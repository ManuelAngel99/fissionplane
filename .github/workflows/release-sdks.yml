name: Release SDKs

on:
  push:
    tags:
      - 'sdks/v*'

concurrency:
  group: release-sdks-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate, test, and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      python-version: ${{ steps.version.outputs.python_version }}
      npm-tag: ${{ steps.version.outputs.npm_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::SDK releases must point to a commit reachable from main."
            exit 1
          }

      - name: Validate release versions
        id: version
        run: |
          python3 scripts/check_sdk_release_version.py \
            "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.97'

      - name: Test and package TypeScript
        working-directory: src/sdks/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build
          mkdir -p ../../../dist/sdk-release/npm
          npm pack --pack-destination ../../../dist/sdk-release/npm

      - name: Test and package Python
        working-directory: src/sdks/python
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest -q
          mkdir -p ../../../dist/sdk-release/python
          uv build --out-dir ../../../dist/sdk-release/python

      - name: Test and package Rust
        run: |
          cargo test --locked -p fissionplane
          cargo publish --locked -p fissionplane --dry-run

      - name: Record distribution checksums
        working-directory: dist/sdk-release
        run: |
          find npm python -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-distributions
          path: dist/sdk-release
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Publish npm
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-distributions
          path: dist/sdk-release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish with npm trusted publishing
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NPM_TAG: ${{ needs.preflight.outputs.npm-tag }}
        run: |
          if npm view "@fissionplane/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@fissionplane/sdk@$VERSION is already published; treating this as a retry."
            exit 0
          fi
          npm publish dist/sdk-release/npm/*.tgz \
            --access public \
            --tag "$NPM_TAG"

  pypi:
    name: Publish PyPI
    needs: preflight
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-distributions
          path: dist/sdk-release
      - name: Check whether this is a retry
        id: existing
        env:
          VERSION: ${{ needs.preflight.outputs.python-version }}
        run: |
          if curl --fail --silent "https://pypi.org/pypi/fissionplane/$VERSION/json" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "fissionplane==$VERSION is already published; treating this as a retry."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with PyPI trusted publishing
        if: steps.existing.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/sdk-release/python
          print-hash: true

  crates-io:
    name: Publish crates.io
    needs: preflight
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.97'
      - name: Check whether this is a retry
        id: existing
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - "$VERSION" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          import urllib.request

          version, output_path = sys.argv[1:]
          request = urllib.request.Request(
              "https://crates.io/api/v1/crates/fissionplane",
              headers={"User-Agent": "fissionplane-release-workflow"},
          )
          try:
              with urllib.request.urlopen(request) as response:
                  releases = json.load(response)["versions"]
          except Exception:
              releases = []
          exists = any(release["num"] == version for release in releases)
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"published={'true' if exists else 'false'}\n")
          if exists:
              print(f"fissionplane {version} is already published; treating this as a retry.")
          PY
      - name: Authenticate with crates.io trusted publishing
        if: steps.existing.outputs.published != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish with crates.io trusted publishing
        if: steps.existing.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked -p fissionplane

  release:
    name: Verify and create GitHub Release
    needs: [preflight, npm, pypi, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-distributions
          path: dist/sdk-release
      - name: Verify all registries
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PYTHON_VERSION: ${{ needs.preflight.outputs.python-version }}
        run: |
          test "$(npm view "@fissionplane/sdk@$VERSION" version)" = "$VERSION"
          curl --fail --silent \
            "https://pypi.org/pypi/fissionplane/$PYTHON_VERSION/json" \
            >/dev/null
          python3 - "$VERSION" <<'PY'
          import json
          import sys
          import urllib.request

          version = sys.argv[1]
          request = urllib.request.Request(
              "https://crates.io/api/v1/crates/fissionplane",
              headers={"User-Agent": "fissionplane-release-workflow"},
          )
          with urllib.request.urlopen(request) as response:
              releases = json.load(response)["versions"]
          if not any(release["num"] == version for release in releases):
              raise SystemExit(f"fissionplane {version} is not visible on crates.io")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists; treating this as a retry."
            exit 0
          fi

          args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --generate-notes
            --title "FissionPlane SDKs $VERSION"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" \
            dist/sdk-release/npm/* \
            dist/sdk-release/python/* \
            dist/sdk-release/SHA256SUMS
