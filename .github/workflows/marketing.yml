name: Marketing site

on:
  pull_request:
    paths:
      - 'src/apps/marketing-site/**'
      - 'src/package.json'
      - 'src/pnpm-lock.yaml'
      - 'src/pnpm-workspace.yaml'
      - '.github/workflows/marketing.yml'
      - 'justfile'
  workflow_dispatch:

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm --filter @fissionplane/marketing-site format:check
      - name: Check workflow formatting
        working-directory: .
        run: src/node_modules/.bin/oxfmt --config src/.oxfmtrc.json --check .github/workflows/marketing.yml
      - name: Lint
        run: pnpm --filter @fissionplane/marketing-site lint
      - name: Typecheck Astro site
        run: pnpm --filter @fissionplane/marketing-site typecheck
      - name: Typecheck Worker
        run: pnpm --filter @fissionplane/marketing-site worker:typecheck
      - name: Build marketing site
        run: pnpm --filter @fissionplane/marketing-site build
      - name: Validate Worker bundle
        run: pnpm --filter @fissionplane/marketing-site cf:dry-run
      # Audits the built dist over a local static server: catches content
      # and markup regressions (link text, hreflang, LCP, a11y) before
      # merge. CDN behavior (cache TTLs, compression) is covered by the
      # post-deploy production audit in deploy-marketing.yml.
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: src/apps/marketing-site/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
