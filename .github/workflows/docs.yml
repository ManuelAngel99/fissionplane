name: Product docs

on:
  pull_request:
    paths:
      - 'src/apps/fissionplane-docs/**'
      - 'src/package.json'
      - 'src/pnpm-lock.yaml'
      - 'src/pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'src/apps/fissionplane-docs/**'
      - 'src/package.json'
      - 'src/pnpm-lock.yaml'
      - 'src/pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
      - 'justfile'
  workflow_dispatch:

concurrency:
  group: product-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate product documentation
        run: pnpm run check:docs
