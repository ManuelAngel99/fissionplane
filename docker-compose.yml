# Local development datastores for fissionplane (docs/development.md).
#
# Store roles are architecture-defined (docs/architecture/overview.md):
#   postgres   — the source of truth: organisations, quotas, templates,
#                sandboxes, paused snapshots, API keys
#   redis      — routing cache, rate limits, short-lived locks.
#                Rebuildable; NEVER authoritative
#   clickhouse — usage metering and analytics (the metering sink the
#                control-plane document describes)
#   minio      — S3-compatible object storage for artifacts (templates,
#                snapshots, filesystem layers)
#
# Rules for this file (keep them when editing):
#   - every service has a healthcheck; dependents use
#     `condition: service_healthy`, never sleeps
#   - host ports bind 127.0.0.1 only and are overridable via .env —
#     databases must never be reachable from the LAN
#   - images are pinned; bumps are deliberate commits, and the same
#     majors run in production (compose is dev-only, never shipped)
#   - no container_name: compose namespaces everything per project
#
# The platform binaries do NOT run here. For iteration speed they run
# on the host (`cargo watch -x 'run -p control-plane'`) against these
# datastores; only their deploy manifests containerise them.

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fissionplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fissionplane-dev}
      POSTGRES_DB: ${POSTGRES_DB:-fissionplane}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on first boot of a fresh volume (database bootstrap).
      - ./deploy/dev/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    # A rebuildable cache: no AOF, no RDB snapshots, no volume. Losing
    # it locally exercises the same refill path as losing it in prod.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse:25.4.5.24
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-fissionplane}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-fissionplane-dev}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-fissionplane}
      # Allow GRANT/CREATE USER via SQL (dev convenience).
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9002}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/dev/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # CMD-SHELL so the container's env expands; the list form execs
      # without a shell and would pass "$CLICKHOUSE_USER" literally.
      test:
        - CMD-SHELL
        - clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fissionplane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fissionplane-dev}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the artifact bucket, then exits. Kept as a
  # separate service so minio stays a stock image.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fissionplane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fissionplane-dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/fissionplane-artifacts
      "

  # `docker compose --profile tools up -d` — ad-hoc DB inspection UI on
  # http://127.0.0.1:8080 (postgres, clickhouse, and minio via S3).
  adminer:
    profiles: ["tools"]
    image: adminer:5.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

volumes:
  postgres-data:
  clickhouse-data:
  minio-data:
